<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe5dc"/><stop offset="1" stop-color="#f6efe8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ab8e"/><stop offset="1" stop-color="#dcc3a8"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf7f2"/><stop offset="1" stop-color="#eadfd4"/>
    </linearGradient>
    <linearGradient id="cabR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fbf7f2"/><stop offset="1" stop-color="#eadfd4"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c8ba"/><stop offset="1" stop-color="#e6d8cc"/>
    </linearGradient>
    <linearGradient id="mirror" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfbf8"/><stop offset=".5" stop-color="#ebe3dc"/><stop offset="1" stop-color="#f7f2ed"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy="0" r=".9">
      <stop offset="0" stop-color="#fff6e6" stop-opacity=".95"/><stop offset="1" stop-color="#fff6e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx=".5" cy=".45" r=".75">
      <stop offset=".6" stop-color="#5a4638" stop-opacity="0"/><stop offset="1" stop-color="#5a4638" stop-opacity=".22"/>
    </radialGradient>
    <radialGradient id="rug" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f3e3df"/><stop offset=".8" stop-color="#e6cdc9"/><stop offset="1" stop-color="#d9bab6"/>
    </radialGradient>
  </defs>

  <!-- back wall with panelling -->
  <rect width="400" height="640" fill="url(#wall)"/>
  <g fill="none" stroke="#e2d5c9" stroke-width="1.5">
    <rect x="128" y="70" width="144" height="150" rx="2"/>
    <rect x="128" y="236" width="144" height="250" rx="2"/>
  </g>

  <!-- arched mirror on the back wall -->
  <path d="M158 470V205a42 42 0 0 1 84 0v265z" fill="#c9a98a"/>
  <path d="M163 466V206a37 37 0 0 1 74 0v260z" fill="url(#mirror)"/>
  <path d="M172 440V214a26 26 0 0 1 10-20" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".8"/>

  <!-- floor -->
  <path d="M0 500h400v140H0z" fill="url(#floor)"/>
  <g stroke="#b99a7c" stroke-width="1" opacity=".55">
    <path d="M0 524h400M0 556h400M0 596h400"/>
    <path d="M200 500V640M150 500L96 640M100 500L-10 640M250 500l54 140M300 500l110 140M60 500L-90 640M340 500l150 140"/>
  </g>
  <rect y="494" width="400" height="8" fill="#e9ddd1"/>
  <rect y="500" width="400" height="14" fill="#5a4638" opacity=".08"/>

  <!-- left wardrobe (receding) -->
  <path d="M0 30l118 52v420L0 560z" fill="url(#cab)"/>
  <path d="M10 62l98 40v186l-98 14z" fill="url(#inner)"/>
  <path d="M10 318l98-12v84l-98 22z" fill="url(#inner)"/>
  <path d="M10 428l98-20v82l-98 44z" fill="url(#inner)"/>
  <path d="M10 82l98 34" stroke="#b9a08a" stroke-width="3" stroke-linecap="round"/>
  <!-- hanging clothes, left -->
  <g>
    <path d="M18 88l16 6-2 150-18 4z" fill="#b9797c"/>
    <path d="M36 95l15 5-1 118-16 3z" fill="#e8d9c8"/>
    <path d="M53 101l14 5-1 150-15 3z" fill="#6d7f8f"/>
    <path d="M69 107l13 4-1 104-14 3z" fill="#d7b9a0"/>
    <path d="M84 112l12 4-1 138-13 2z" fill="#3f3a3c"/>
    <path d="M97 116l9 3v96l-10 2z" fill="#c9d3c2"/>
  </g>
  <!-- folded stacks and boxes, left -->
  <g>
    <path d="M18 388l34-6v-10l-34 5z" fill="#e8d9c8"/><path d="M18 377l34-5v-9l-34 5z" fill="#b9797c"/>
    <path d="M18 368l34-5v-9l-34 5z" fill="#f4ece4"/>
    <path d="M62 380l36-7v-26l-36 6z" fill="#d9c3ae"/><path d="M62 353l36-6" stroke="#bfa58d" stroke-width="1.5"/>
  </g>
  <!-- shoes, left -->
  <g fill="#3f3a3c">
    <path d="M20 524l20-9 8 1v6l-28 13z"/><path d="M56 508l18-8 7 1v6l-25 11z" fill="#b9797c"/>
    <path d="M84 496l14-6 6 1v5l-20 9z" fill="#d7b9a0"/>
  </g>

  <!-- right wardrobe (receding) -->
  <path d="M400 30L282 82v420l118 58z" fill="url(#cabR)"/>
  <path d="M390 62l-98 40v186l98 14z" fill="url(#inner)"/>
  <path d="M390 318l-98-12v84l98 22z" fill="url(#inner)"/>
  <path d="M390 428l-98-20v82l98 44z" fill="url(#inner)"/>
  <path d="M390 82l-98 34" stroke="#b9a08a" stroke-width="3" stroke-linecap="round"/>
  <g>
    <path d="M382 88l-16 6 2 164 18 4z" fill="#f4ece4"/>
    <path d="M364 95l-15 5 1 108 16 3z" fill="#9a5d62"/>
    <path d="M347 101l-14 5 1 146 15 3z" fill="#c8b6a6"/>
    <path d="M331 107l-13 4 1 112 14 3z" fill="#7d8c7a"/>
    <path d="M316 112l-12 4 1 140 13 2z" fill="#e3c9c4"/>
    <path d="M303 116l-9 3v92l10 2z" fill="#4f5b6b"/>
  </g>
  <!-- bags and hat box, right -->
  <g>
    <path d="M378 392l-30-6v-30l30 5z" fill="#b08a6a"/>
    <path d="M372 362c0-16-18-18-18-3" stroke="#8d6c50" stroke-width="2.5" fill="none"/>
    <path d="M338 384l-34-6v-22l34 5z" fill="#e8d9c8"/><path d="M338 362l-34-6" stroke="#cdb9a4" stroke-width="1.5"/>
  </g>
  <g>
    <path d="M380 524l-20-9-8 1v6l28 13z" fill="#c8b6a6"/><path d="M344 508l-18-8-7 1v6l25 11z" fill="#3f3a3c"/>
    <path d="M316 496l-14-6-6 1v5l20 9z" fill="#f4ece4"/>
  </g>

  <!-- pendant lamp and warm light -->
  <path d="M200 0v34" stroke="#b9a08a" stroke-width="1.5"/>
  <path d="M182 50a18 18 0 0 1 36 0z" fill="#d8b98f"/>
  <ellipse cx="200" cy="52" rx="16" ry="3" fill="#fff3d6"/>
  <rect x="40" y="40" width="320" height="420" fill="url(#glow)" opacity=".7"/>

  <!-- rug where she stands -->
  <ellipse cx="200" cy="600" rx="150" ry="34" fill="url(#rug)"/>
  <ellipse cx="200" cy="600" rx="128" ry="27" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/>

  <rect width="400" height="640" fill="url(#shade)"/>
</svg>
